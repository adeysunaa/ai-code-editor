name: Summarize Merged Pull Request

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  summarize:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Generate AI summary
        uses: actions/github-script@v7
        env:
          OPENAI_API_KEY: ${{ secrets.GITHUB }}
        with:
          script: |
            const pr = context.payload.pull_request;

            const response = await fetch(
              "https://api.openai.com/v1/responses",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  Authorization: `Bearer ${process.env.OPENAI_API_KEY}`,
                },
                body: JSON.stringify({
                  model: "gpt-4.1-mini",
                  input: `Summarize this merged pull request in simple English.
            Explain what changed, why it matters, and any important files.
            Keep the summary concise.

            Title: ${pr.title}
            Description: ${pr.body || "No description provided"}`
                }),
              }
            );

            if (!response.ok) {
              throw new Error(
                `OpenAI API error: ${response.status} ${await response.text()}`
              );
            }

            const result = await response.json();
            const summary = result.output
              .flatMap(item => item.content || [])
              .filter(item => item.type === "output_text")
              .map(item => item.text)
              .join("\n");

            if (!summary) {
              throw new Error("OpenAI returned an empty summary.");
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `## AI Merge Summary\n\n${summary}`,
            });
