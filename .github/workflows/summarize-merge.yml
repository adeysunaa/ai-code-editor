name: Summarize Merged Pull Request

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  summarize:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Generate AI summary with Gemini
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const pr = context.payload.pull_request;

            const response = await fetch(
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "x-goog-api-key": process.env.GEMINI_API_KEY,
                },
                body: JSON.stringify({
                  contents: [{
                    parts: [{
                      text: `Summarize this merged pull request in simple English.
            Explain what changed, why it matters, and important files.
            Keep the summary concise.

            Title: ${pr.title}
            Description: ${pr.body || "No description provided"}`
                    }]
                  }]
                })
              }
            );

            if (!response.ok) {
              throw new Error(
                `Gemini API error: ${response.status} ${await response.text()}`
              );
            }

            const result = await response.json();
            const summary =
              result.candidates?.[0]?.content?.parts
                ?.map(part => part.text || "")
                .join("\n") || "";

            if (!summary) {
              throw new Error("Gemini returned an empty summary.");
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `## AI Merge Summary\n\n${summary}`,
            });
